<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BinaryShop - Iniciar Sesión</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-image: url('img/fondo.png'); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;">

  <header>
    <div class="logo" style="display: flex; align-items: center; gap: 10px;">
      <img src="img/logo.png" alt="BinaryShop Logo" style="height: 40px; width: auto; border-radius: 4px;">
      <h1>BinaryShop</h1>
    </div>
    <nav>
      <a href="index.html">Catálogo</a>
      <a href="login.html">Iniciar Sesión</a>
      <a href="registro.html">Registrarse</a>
    </nav>
  </header>

  <main>
    <div class="contenedor-formulario">
      <h2>Iniciar Sesión</h2>
      
      <form id="form-login" class="form-binary">
        <label for="nickname">Nickname (Usuario):</label>
        <input type="text" id="nickname" required placeholder="Ej: falcoxd, Rebeca, David">

        <label for="password">Contraseña:</label>
        <input type="password" id="password" required placeholder="********">

        <label for="rol">Selecciona tu Rol:</label>
        <select id="rol" required>
          <option value="" disabled selected>Selecciona una opción</option>
          <option value="comprador">Comprador</option>
          <option value="vendedor">Vendedor</option>
          <option value="administrador">Administrador</option>
        </select>

        <button type="submit" class="btn-principal" style="width: 100%;">Entrar</button>
      </form>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script>
    document.getElementById("form-login").addEventListener("submit", (e) => {
      e.preventDefault();
      const nick = document.getElementById("nickname").value.trim();
      const pass = document.getElementById("password").value.trim();
      const rolSelect = document.getElementById("rol").value;

      const exito = iniciarSesion(nick, pass, rolSelect);
      if (exito) {
        window.location.href = "index.html";
      }
    });
  </script>
</body>
</html>
